<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工事中 | Project LPT</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .construction-page {
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px 60px;
            box-sizing: border-box;
        }
        .construction-label {
            color: #990000;
            font-family: "Courier New", monospace;
            font-size: 13px;
            letter-spacing: 3px;
            margin-bottom: 18px;
        }
        .construction-page h2 {
            margin: 0 0 28px;
            color: #FFFFFF;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(25px, 4vw, 36px);
            letter-spacing: 3px;
            font-weight: normal;
        }
        .construction-page .message {
            color: #CCCCCC;
            font-size: 16px;
            line-height: 2;
            margin: 0 0 30px;
        }
        .construction-page .home-link {
            display: inline-block;
            color: #990000;
            font-family: "Courier New", monospace;
            text-decoration: none;
            letter-spacing: 1px;
            transition: color 0.2s;
        }
        .construction-page .home-link:hover {
            color: #FFFFFF;
            text-decoration: underline;
        }
        .construction-page .site-name {
            margin-top: 48px;
            color: #888888;
            font-family: "Courier New", monospace;
            font-size: 11px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body class="frame-page">
    <main class="frame-content construction-page">
        <p class="construction-label">UNDER CONSTRUCTION</p>
        <h2>工事中</h2>
        <p class="message">このページは現在、鋭意作成中です。<br>公開まで、今しばらくお待ちください。</p>
        <a href="home.html" class="home-link">← HOME に戻る</a>
        <p class="site-name">Project LPT</p>
    </main>
</body>
</html>
